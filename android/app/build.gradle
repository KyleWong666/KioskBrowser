apply plugin: 'com.android.application'

android {
    compileSdkVersion 32
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.ssdc.kiosk"
        minSdkVersion 24
        targetSdkVersion 29   // 29 + requestLegacyExternalStorage → /sdcard/kiosk/ 直接可读写
        versionCode 1
        versionName "1.0.0"
    }

    // 发布签名（keystore 不入库，首次构建用 keytool 生成，见 docs/android-deploy.md）
    def kioskKs = file("../keystore/kiosk.jks")

    signingConfigs {
        release {
            storeFile kioskKs
            storePassword "kiosk123"
            keyAlias "kiosk"
            keyPassword "kiosk123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (kioskKs.exists()) signingConfig signingConfigs.release
        }
        debug {
            if (kioskKs.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false   // AGP 4.0.1 lintVital 在含空格路径下起子进程失败
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
}
