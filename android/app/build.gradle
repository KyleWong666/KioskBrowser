apply plugin: 'com.android.application'

android {
    compileSdkVersion 32
    buildToolsVersion "29.0.3"
    ndkVersion "23.1.7779620"   // AGP 4.0.1 默认要 21.x，本机只有 23.1（含原生 .so 后需 strip）

    defaultConfig {
        applicationId "com.ssdc.kiosk"
        minSdkVersion 24
        targetSdkVersion 29   // 29 + requestLegacyExternalStorage → /sdcard/kiosk/ 直接可读写
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }  // kiosk 板全 ARM，去掉 x86 减包
    }

    // 发布签名（keystore 不入库，首次构建用 keytool 生成，见 docs/android-deploy.md）
    def kioskKs = file("../keystore/kiosk.jks")

    signingConfigs {
        release {
            storeFile kioskKs
            storePassword "kiosk123"
            keyAlias "kiosk"
            keyPassword "kiosk123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (kioskKs.exists()) signingConfig signingConfigs.release
        }
        debug {
            if (kioskKs.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false   // AGP 4.0.1 lintVital 在含空格路径下起子进程失败
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation files('libs/sherpa-onnx-1.13.8.aar')   // 语音输入（下载见 docs/android-deploy.md）
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'  // sherpa-onnx AAR 依赖
}
