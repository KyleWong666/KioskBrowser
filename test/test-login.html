<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Kiosk 测试页</title>
<style>
  body { background:#16213e; color:#eee; font-family:'Microsoft YaHei',sans-serif;
         display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { background:#1f2b4d; padding:48px 56px; border-radius:16px; width:420px;
          box-shadow:0 8px 40px rgba(0,0,0,.5); }
  h1 { margin-top:0; font-size:22px; color:#7db4ff; }
  input { width:100%; box-sizing:border-box; padding:14px; margin:10px 0; font-size:16px;
          border-radius:8px; border:1px solid #3a4a75; background:#141c33; color:#eee; }
  button { width:100%; padding:14px; font-size:17px; border:none; border-radius:8px;
           background:#3b6fd4; color:#fff; cursor:pointer; margin-top:8px; }
  #biz { display:none; }
  .ok { color:#6fdc8c; }
  textarea { width:100%; box-sizing:border-box; height:110px; padding:12px; font-size:16px;
             border-radius:8px; border:1px solid #3a4a75; background:#141c33; color:#eee; }
</style>
</head>
<body>
<div class="card" id="loginCard">
  <h1>测试登录页</h1>
  <p style="color:#8899bb">凭据：admin / test123</p>
  <input id="username" type="text" placeholder="用户名">
  <input id="password" type="password" placeholder="密码">
  <button id="login-btn">登 录</button>
  <p id="err" style="color:#e08080;display:none">用户名或密码错误</p>
</div>

<div class="card" id="biz">
  <h1 class="ok">✔ 登录成功，业务页面</h1>
  <p>点击下方输入框应弹出自定义软键盘：</p>
  <input id="q" type="text" placeholder="单行输入测试">
  <textarea placeholder="多行输入测试"></textarea>
</div>

<script>
document.getElementById('login-btn').addEventListener('click', function(){
  var u = document.getElementById('username').value;
  var p = document.getElementById('password').value;
  if (u === 'admin' && p === 'test123') {
    document.getElementById('loginCard').remove();  // 从 DOM 移除，模拟登录成功的判定依据
    document.getElementById('biz').style.display = 'block';
  } else {
    document.getElementById('err').style.display = 'block';
  }
});
</script>
</body>
</html>
